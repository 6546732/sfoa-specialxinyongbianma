<template>
    <lightning-card title="客户省市批量补全" icon-name="standard:address">
        <div class="slds-p-around_medium">
            <p>上传单列 UTF-8 CSV，表头为 Id，每行一个15或18位客户ID，每次最多300条。上传后先检查，再点击开始处理。</p>
            <p class="slds-m-top_small">仅处理经营范围非空且开单省份或城市为空的客户。优先识别街道；街道为空或无法识别时按客户名称联网查询。只补空省市，不生成或修改客户编码。</p>
            <lightning-input type="file" label="上传客户ID文件" accept=".csv,.txt" onchange={upload} disabled={busy}></lightning-input>
            <div class="slds-m-vertical_small">
                <lightning-button label="开始处理符合条件的客户" variant="brand" onclick={start} disabled={submitDisabled}></lightning-button>
                <lightning-button class="slds-m-left_small" label="刷新进度" onclick={refresh} disabled={refreshDisabled}></lightning-button>
            </div>
            <p>后台逐条处理，页面每10秒更新进度。关闭页面后任务继续，可在“客户地址补全记录”查看结果。失败或未匹配不会自动反复联网；核对后可重新上传相应ID。</p>
            <p class="slds-m-vertical_small" role="status">{summary}</p>
            <template lwc:if={error}><p class="slds-text-color_error" role="alert">{error}</p></template>
            <lightning-combobox label="按处理原因筛选" value={reasonFilter} options={reasonOptions} onchange={filterReason}></lightning-combobox>
            <lightning-datatable key-field="key" data={visibleRows} columns={columns} hide-checkbox-column sorted-by={sortedBy} sorted-direction={sortDirection} onsort={sortRows}></lightning-datatable>
        </div>
    </lightning-card>
</template>
